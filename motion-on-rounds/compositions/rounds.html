        <span class="tab"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M4.5 5h13a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H10l-4 3.2V16H4.5A1.5 1.5 0 0 1 3 14.5v-8A1.5 1.5 0 0 1 4.5 5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Messages</span>
      </nav>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Scroll stops (points): content top 0 → meds 218 → labs 684 → end 826 (content 1670 tall in an 844 screen).
    // The indicator thumb is 293 pt on a 580 pt track, so it travels 287 pt over 826 pt of scroll.
    const MAX = 826;
    const thumb = (s) => (s / MAX) * 287;
    const SEG = 87.5;
    // resting state at the top of the loop
    tl.fromTo("#ph-scroll", { y: 0 }, { y: 0, duration: 0.01 }, 0);
    tl.fromTo("#ph-bar", { y: 0, opacity: 0 }, { y: 0, opacity: 0, duration: 0.01 }, 0);
    tl.fromTo("#seg-ind", { x: 0 }, { x: 0, duration: 0.01 }, 0);

    const scroll = (at, from, to, dur, segIndex, segFrom) => {
      tl.fromTo("#ph-scroll", { y: -from }, { y: -to, duration: dur, ease: "power3.inOut", immediateRender: false }, at);
      tl.fromTo("#ph-bar", { y: thumb(from) }, { y: thumb(to), duration: dur, ease: "power3.inOut", immediateRender: false }, at);
      tl.fromTo("#ph-bar", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, at);
      tl.fromTo("#ph-bar", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, at + dur + 0.45);
      tl.fromTo("#seg-ind", { x: segFrom * SEG }, { x: segIndex * SEG, duration: 0.5, ease: "power3.inOut", immediateRender: false }, at + dur * 0.35);
    };

    // header glass appears once content runs under it, and clears when back at the top
    tl.fromTo("#ph-headbg", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.0);
    tl.fromTo("#ph-headbg", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, 10.3);

    // baselines for things that change mid-loop
    tl.fromTo(".chk-on[id^='ok-']", { opacity: 0, scale: 0.4 }, { opacity: 0, scale: 0.4, duration: 0.01 }, 0);
    tl.fromTo("#lab-done", { opacity: 0, x: 6 }, { opacity: 0, x: 6, duration: 0.01 }, 0);
    tl.fromTo("#lab-review", { opacity: 1, x: 0 }, { opacity: 1, x: 0, duration: 0.01 }, 0);
    tl.fromTo("#task-strike", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 0, duration: 0.01 }, 0);
    tl.fromTo("#task-lab-txt", { color: "#0b1324" }, { color: "#0b1324", duration: 0.01 }, 0);

    // ── 0.9 scroll to medications ──
    scroll(0.9, 0, 218, 1.2, 1, 0);

    // ── 2.5 reconcile A, B and D one by one ──
    ["#ok-a", "#ok-b", "#ok-d"].forEach((id, i) => {
      tl.fromTo(id, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, 2.5 + i * 0.5);
    });

    // ── 4.2 on to labs; panel 3 gets signed off ──
    scroll(4.2, 218, 684, 1.3, 2, 1);
    tl.fromTo("#lab-review", { opacity: 1, x: 0 }, { opacity: 0, x: -4, duration: 0.15, ease: "power2.in", immediateRender: false }, 6.0);
    tl.fromTo("#lab-done", { opacity: 0, x: 6 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, 6.1);

    // ── 6.6 to the end: care team and next steps; the lab task is ticked ──
    scroll(6.6, 684, MAX, 1.0, 3, 2);
    tl.fromTo("#ok-task", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, 8.0);
    tl.fromTo("#task-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 8.1);
    tl.fromTo("#task-lab-txt", { color: "#0b1324" }, { color: "#56657c", duration: 0.3, ease: "power2.out", immediateRender: false }, 8.1);

    // medication ticks reset while the meds card is off screen, so the loop starts clean
    tl.fromTo("#ok-a, #ok-b, #ok-d", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.4, duration: 0.01, immediateRender: false }, 8.6);

    // ── 9.0 back to the top ──
    scroll(9.0, MAX, 0, 1.7, 0, 3);

    // lab and task states reset once they are below the fold again
    tl.fromTo("#lab-done", { opacity: 1, x: 0 }, { opacity: 0, x: 6, duration: 0.01, immediateRender: false }, 11.0);
    tl.fromTo("#lab-review", { opacity: 0, x: -4 }, { opacity: 1, x: 0, duration: 0.01, immediateRender: false }, 11.0);
    tl.fromTo("#ok-task", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.4, duration: 0.01, immediateRender: false }, 11.0);
    tl.fromTo("#task-strike", { scaleX: 1 }, { scaleX: 0, duration: 0.01, immediateRender: false }, 11.0);
    tl.fromTo("#task-lab-txt", { color: "#56657c" }, { color: "#0b1324", duration: 0.01, immediateRender: false }, 11.0);

    window.__timelines["rounds"] = tl;
  </script>
</template>
