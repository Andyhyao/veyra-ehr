<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Accent","default":"#2563EB"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=780, height=1688" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* A phone screen (390 × 844 pt) drawn at 2×, so the render is 780 × 1688. The bezel is added where it is placed. */
      :root {
        --accent: #2563eb;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 780px;
        height: 1688px;
        overflow: hidden;
        background: #e8edf5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13"
      data-width="780"
      data-height="1688"
    >
      <div
        id="context"
        data-composition-id="context"
        data-composition-src="compositions/context.html"
        data-start="0"
        data-duration="13"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="780"
        data-height="1688"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
