  <script>
    const tl = gsap.timeline({ paused: true });

    // Scroll stops (points): photo 0 → summary 700 → end 912 (content 1756 tall in an 844 screen).
    // The photo moves at 55% of the scroll speed for depth; the indicator thumb travels 374 pt over 912 pt.
    const MAX = 912;
    const thumb = (s) => (s / MAX) * 374;

    // resting state: the photo, full screen
    tl.fromTo("#cx-scroll", { y: 0 }, { y: 0, duration: 0.01 }, 0);
    tl.fromTo("#cx-photo", { y: 0 }, { y: 0, duration: 0.01 }, 0);
    tl.fromTo("#cx-bar", { y: 0, opacity: 0 }, { y: 0, opacity: 0, duration: 0.01 }, 0);
    tl.fromTo("#cx-head", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    tl.fromTo("#cx-intro", { opacity: 1, y: 0 }, { opacity: 1, y: 0, duration: 0.01 }, 0);
    tl.fromTo("#ma-ok, #mb-ok", { opacity: 0, x: 6 }, { opacity: 0, x: 6, duration: 0.01 }, 0);
    tl.fromTo("#ma-due, #mb-due", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
    tl.fromTo("#plan-fill", { scaleX: 1 / 3, transformOrigin: "0% 50%" }, { scaleX: 1 / 3, duration: 0.01 }, 0);
    tl.fromTo("#step-2-on", { opacity: 0, scale: 0.4 }, { opacity: 0, scale: 0.4, duration: 0.01 }, 0);

    const scroll = (at, from, to, dur) => {
      tl.fromTo("#cx-scroll", { y: -from }, { y: -to, duration: dur, ease: "power3.inOut", immediateRender: false }, at);
      tl.fromTo("#cx-photo", { y: from * 0.45 }, { y: to * 0.45, duration: dur, ease: "power3.inOut", immediateRender: false }, at);
      tl.fromTo("#cx-bar", { y: thumb(from) }, { y: thumb(to), duration: dur, ease: "power3.inOut", immediateRender: false }, at);
      tl.fromTo("#cx-bar", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, at);
      tl.fromTo("#cx-bar", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, at + dur + 0.45);
    };

    // ── 1.4 the record sheet rises over the photo ──
    scroll(1.4, 0, 700, 1.6);
    tl.fromTo("#cx-intro", { opacity: 1, y: 0 }, { opacity: 0, y: -16, duration: 0.5, ease: "power2.in", immediateRender: false }, 1.55);
    tl.fromTo("#cx-head", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, 2.45);

    // ── 3.5 both medications reconciled ──
    [["#ma-due", "#ma-ok"], ["#mb-due", "#mb-ok"]].forEach(([due, ok], i) => {
      const at = 3.5 + i * 0.55;
      tl.fromTo(due, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, at);
      tl.fromTo(ok, { opacity: 0, x: 6 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, at + 0.08);
    });

    // ── 5.0 on to the care plan; the lab review is done ──
    scroll(5.0, 700, MAX, 1.3);
    tl.fromTo("#step-2-on", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, 6.8);
    tl.fromTo("#plan-fill", { scaleX: 1 / 3 }, { scaleX: 2 / 3, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 6.9);

    // ── 9.0 back up to the photo ──
    scroll(9.0, MAX, 0, 1.9);
