<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Accent","default":"#2563EB"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=402, height=874" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The iPhone screen cutout of hero-iphone.png: 402 × 874, inset 24 / 23. */
      :root {
        --accent: #2563eb;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 402px;
        height: 874px;
        overflow: hidden;
        background: #e8edf5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="402"
      data-height="874"
    >
      <div
        id="mobile"
        data-composition-id="mobile"
        data-composition-src="compositions/mobile.html"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="402"
        data-height="874"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
