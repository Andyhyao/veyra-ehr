  <script>
    const tl = gsap.timeline({ paused: true });

    // Scroll stops (points): top 0 → preview card 430 → clinics strip 591 (page 1465 tall in an 874 screen).
    // The indicator thumb is 466 pt on a 782 pt track, so it travels 316 pt over 591 pt of scroll.
    const MAX = 591;
    const thumb = (s) => (s / MAX) * 316;

    // resting state = the still image
    tl.fromTo("#mb-scroll", { y: 0 }, { y: 0, duration: 0.01 }, 0);
    tl.fromTo("#mb-bar", { y: 0, opacity: 0 }, { y: 0, opacity: 0, duration: 0.01 }, 0);
    tl.fromTo("#mb-headbg", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    tl.fromTo("#tab-1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
    tl.fromTo("#tab-2, #tab-3", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    tl.fromTo("#pn-1", { opacity: 1, x: 0 }, { opacity: 1, x: 0, duration: 0.01 }, 0);
    tl.fromTo("#pn-2, #pn-3", { opacity: 0, x: 14 }, { opacity: 0, x: 14, duration: 0.01 }, 0);

    const scroll = (at, from, to, dur) => {
      tl.fromTo("#mb-scroll", { y: -from }, { y: -to, duration: dur, ease: "power3.inOut", immediateRender: false }, at);
      tl.fromTo("#mb-bar", { y: thumb(from) }, { y: thumb(to), duration: dur, ease: "power3.inOut", immediateRender: false }, at);
      tl.fromTo("#mb-bar", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, at);
      tl.fromTo("#mb-bar", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, at + dur + 0.45);
    };

    // tab n takes over from tab m: its pill fades in, its panel slides in from the right
    const tab = (at, m, n) => {
      tl.fromTo(`#tab-${m}`, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.inOut", immediateRender: false }, at);
      tl.fromTo(`#tab-${n}`, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut", immediateRender: false }, at);
      tl.fromTo(`#pn-${m}`, { opacity: 1, x: 0 }, { opacity: 0, x: -14, duration: 0.25, ease: "power2.in", immediateRender: false }, at);
      tl.fromTo(`#pn-${n}`, { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, at + 0.15);
    };

    // ── 1.3 the page scrolls up to the dashboard preview ──
    scroll(1.3, 0, 430, 1.4);
    tl.fromTo("#mb-headbg", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, 1.55);

    // ── 3.1 the preview's tabs take a turn each ──
    tab(3.1, 1, 2);
    tab(4.5, 2, 3);
    tab(5.9, 3, 1);
    // the outgoing panels park back on the right once hidden, ready for the next pass
    tl.fromTo("#pn-2", { x: -14 }, { x: 14, duration: 0.01, immediateRender: false }, 4.9);
    tl.fromTo("#pn-3", { x: -14 }, { x: 14, duration: 0.01, immediateRender: false }, 6.3);

    // ── 6.6 on to the fictional clinics strip ──
    scroll(6.6, 430, MAX, 1.0);

    // ── 9.0 back to the top ──
    scroll(9.0, MAX, 0, 1.6);
    tl.fromTo("#mb-headbg", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, 10.25);

    window.__timelines["mobile"] = tl;
  </script>
