  <script>
    const tl = gsap.timeline({ paused: true });
    // Each odometer column holds 0–9, so digit d sits at yPercent -10·d.
    const at = (d) => -10 * d;
    // resting digits = the numbers baked into the still: 324 · 96% · 1,243 · 18 min
    const START = { "#k1": 4, "#k2": 6, "#k3": 3, "#k4": 8 };
    // the readout parks beside each bar: General, Cardiology, Pediatrics
    const RD_Y = [0, 62, 124];

    // resting state = the still image
    Object.entries(START).forEach(([id, d]) => tl.fromTo(id, { yPercent: at(d) }, { yPercent: at(d), duration: 0.01 }, 0));
    tl.fromTo("#rd", { opacity: 0, y: RD_Y[0] }, { opacity: 0, y: RD_Y[0], duration: 0.01 }, 0);
    tl.fromTo("#rd-roll", { yPercent: 0 }, { yPercent: 0, duration: 0.01 }, 0);
    tl.fromTo("#lg-hit", { opacity: 0, y: 0 }, { opacity: 0, y: 0, duration: 0.01 }, 0);
    tl.fromTo("#an-toast", { opacity: 0, x: 24 }, { opacity: 0, x: 24, duration: 0.01 }, 0);
    tl.fromTo(".num", { opacity: 1, filter: "blur(0px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.01 }, 0);

    const roll = (id, from, to, t) =>
      tl.fromTo(id, { yPercent: at(from) }, { yPercent: at(to), duration: 0.6, ease: "power3.inOut", immediateRender: false }, t);

    // ── 1.0 the readout walks the department bars ──
    tl.fromTo("#rd", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 1.0);
    tl.fromTo("#rd", { y: RD_Y[0] }, { y: RD_Y[1], duration: 0.6, ease: "power3.inOut", immediateRender: false }, 2.4);
    tl.fromTo("#rd-roll", { yPercent: 0 }, { yPercent: -100 / 3, duration: 0.45, ease: "power3.inOut", immediateRender: false }, 2.45);
    tl.fromTo("#rd", { y: RD_Y[1] }, { y: RD_Y[2], duration: 0.6, ease: "power3.inOut", immediateRender: false }, 3.8);
    tl.fromTo("#rd-roll", { yPercent: -100 / 3 }, { yPercent: -200 / 3, duration: 0.45, ease: "power3.inOut", immediateRender: false }, 3.85);
    tl.fromTo("#rd", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, 7.2);

    // ── 1.3 the visit-type legend highlights in turn ──
    tl.fromTo("#lg-hit", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 1.3);
    tl.fromTo("#lg-hit", { y: 0 }, { y: 34, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 3.0);
    tl.fromTo("#lg-hit", { y: 34 }, { y: 68, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 5.0);
    tl.fromTo("#lg-hit", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, 6.8);

    // ── 1.9 a patient is added to the panel ──
    roll("#k1", 4, 5, 1.9);

    // ── 4.4 a visit completes ──
    roll("#k2", 6, 7, 4.4);
    tl.fromTo("#an-toast", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, 4.6);
    tl.fromTo("#an-toast", { opacity: 1, x: 0 }, { opacity: 0, x: 12, duration: 0.2, ease: "power2.in", immediateRender: false }, 6.9);

    // ── 5.8 the active panel grows, and the wait comes down ──
    roll("#k3", 3, 4, 5.8);
    roll("#k4", 8, 7, 6.4);

    // ── 8.7 the numbers settle back to the still's, so the loop starts clean ──
    tl.fromTo(".num", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(4px)", duration: 0.2, ease: "power2.in", immediateRender: false }, 8.7);
    tl.fromTo("#k1", { yPercent: at(5) }, { yPercent: at(4), duration: 0.01, immediateRender: false }, 8.92);
    tl.fromTo("#k2", { yPercent: at(7) }, { yPercent: at(6), duration: 0.01, immediateRender: false }, 8.92);
    tl.fromTo("#k3", { yPercent: at(4) }, { yPercent: at(3), duration: 0.01, immediateRender: false }, 8.92);
    tl.fromTo("#k4", { yPercent: at(7) }, { yPercent: at(8), duration: 0.01, immediateRender: false }, 8.92);
    tl.fromTo(".num", { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false }, 8.95);

    window.__timelines["analytics"] = tl;
  </script>
